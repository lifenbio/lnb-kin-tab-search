version: '2.2'

services:
  app:
    build:
      context: .
      dockerfile: ./.config/dev/Dockerfile
    command: uvicorn main.asgi:application --host 0.0.0.0 --port 8000 --log-level debug
    volumes: 
      - ./:/app/
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    working_dir : /app/
    ports:
      - 8000:8000
    env_file:
      - ./.env.dev
    depends_on:
      - db
      - redis
  db:
    image: postgres:14.5-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - TZ=Asia/Seoul
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=ksol0220
      - POSTGRES_DB=ksol
  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
  celery_worker:
    build:
      context: .
      dockerfile: ./.config/dev/Dockerfile
    command: "celery -A main worker -l info"
    volumes: 
      - ./:/app/
    env_file:
      - ./.env.dev
    depends_on:
      - redis
      - db
  celery_beat:
    build:
      context: .
      dockerfile: ./.config/dev/Dockerfile
    command: "celery -A main beat -l info"
    volumes: 
      - ./:/app/
    env_file:
      - ./.env.dev
    depends_on:
      - redis
      - db
  flower:
    image: mher/flower
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_PORT=5555
    ports:
      - 5555:5555
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
